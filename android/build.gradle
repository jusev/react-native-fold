buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
}

apply plugin: "com.android.library"
if (project.extensions.findByName("kotlin") == null) {
    apply plugin: "kotlin-android"
}
// Runs codegen for this library, generating NativeRNFoldSpec.
apply plugin: "com.facebook.react"

android {
    namespace "com.jusev.rnfold"
    compileSdkVersion safeExtGet("compileSdkVersion", 36)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    // Jetpack WindowManager: the only thing on Android that reports a hinge.
    // window-java is the callback adapter, which keeps kotlinx-coroutines out
    // of the app's dependency graph.
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.window:window:1.3.0"
    implementation "androidx.window:window-java:1.3.0"
}

name: Release

# Publishing happens here and nowhere else.
#
# npm provenance links a published tarball to the exact commit and workflow
# run that built it, and npm shows that as a verified badge. It can only be
# produced by a CI run with an OIDC token — a laptop cannot mint one — so a
# release published by hand is a release nobody can verify. That is the whole
# reason this file exists rather than someone typing `npm publish`.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # write, not read, so the run can turn the tag into a GitHub Release.
      # Nothing else here needs it, and it is the only reason this is not
      # read-only.
      contents: write
      # Required for provenance. Without it `--provenance` fails outright
      # rather than quietly publishing an unattested tarball.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes are the tag's own annotation, and a shallow
          # clone does not always carry the tag object's message.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # No lockfile is committed: this package has no runtime dependencies,
      # and its devDependencies are only a test runner. `npm ci` would fail
      # on the missing lockfile.
      - run: npm install

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        # A tag that disagrees with the version publishes something nobody
        # asked for, under a number nobody can take back.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Show exactly what will be published
        run: npm pack --dry-run

      # Skips a version already on npm rather than failing on it, so a run
      # that died after publishing — a network blip creating the release,
      # say — can simply be re-run instead of needing a throwaway version.
      - name: Publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@jusev/react-native-fold@$VERSION" version >/dev/null 2>&1; then
            echo "@jusev/react-native-fold@$VERSION is already on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After publishing, never before: a release announcing a version that
      # is not on npm is worse than no release at all.
      #
      # Uses the gh CLI, which is already on the runner, rather than a
      # third-party action. This workflow exists to produce an attested
      # tarball, and adding someone else's code to the job that mints it
      # would undercut the point of the attestation.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag's annotation is the release notes: written deliberately
          # at tag time, rather than generated from commit subjects.
          #
          # The explicit re-fetch matters. actions/checkout leaves the tag
          # PEELED — refs/tags/<name> points straight at the commit — so
          # `git tag -l --format=...` finds no annotation and silently
          # reports the commit's message instead. That is what shipped on
          # v0.2.2: the release quoted the last commit, not the tag.
          git fetch --force --tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag; its notes would be the commit message." >&2
            exit 1
          fi
          NOTES="$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")"
          if [ -z "$NOTES" ]; then
            echo "::error::$GITHUB_REF_NAME has no annotation to use as release notes." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n\n---\n\nOn npm: https://www.npmjs.com/package/@jusev/react-native-fold/v/%s\n' \
            "$NOTES" "$VERSION" > /tmp/notes.md
          # Idempotent for the same reason as the publish above.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
          else
            # --verify-tag refuses to invent a release for a tag that is not
            # actually on the remote.
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/notes.md \
              --verify-tag
          fi
